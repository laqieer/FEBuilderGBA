name: "Linux X11 Hosted"

on:
  workflow_call:
    inputs:
      route:
        description: "Hosted issue #2160 route"
        required: true
        type: string
      candidate_sha:
        description: "Immutable reviewed candidate SHA"
        required: true
        type: string
      receipt_stem:
        description: "Private receipt stem"
        required: true
        type: string
      grant_lookup_key:
        description: "Lookup-only grant key"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  prepare:
    name: issue2160 hosted preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: read
    env:
      ISSUE2160_ROUTE: ${{ inputs.route }}
      ISSUE2160_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      ISSUE2160_RECEIPT_STEM: ${{ inputs.receipt_stem }}
      ISSUE2160_GRANT_LOOKUP_KEY: ${{ inputs.grant_lookup_key }}
      GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Verify immutable reviewed candidate before checkout
        shell: bash
        env:
          ISSUE2160_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          for value_name in ISSUE2160_CANDIDATE_SHA GITHUB_SHA GITHUB_WORKFLOW_SHA; do
            value="${!value_name}"
            [[ "$value" =~ ^[0-9a-f]{40}$ ]] || { echo "expected full reviewed SHA for ${value_name}" >&2; exit 1; }
          done
          [[ "$ISSUE2160_CANDIDATE_SHA" == "$GITHUB_SHA" ]]
          [[ "$ISSUE2160_CANDIDATE_SHA" == "$GITHUB_WORKFLOW_SHA" ]]

      - name: Checkout immutable candidate
        id: checkout_candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Gather hosted preflight evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          /usr/bin/python3 -B -m scripts.linux_x11_hosted prepare
          --output TestResults/issue2160-hosted/preflight.json

      - name: Upload hosted preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue2160-hosted-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/issue2160-hosted/preflight.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  native:
    if: ${{ inputs.route == 'issue2160-reserve-native' }}
    name: issue2160 hosted native
    needs: prepare
    runs-on: ubuntu-24.04
    environment:
      name: issue2160-native
    permissions:
      contents: read
      actions: read
      issues: read
    concurrency:
      group: issue2160-native-${{ github.run_id }}
      cancel-in-progress: false
    env:
      ISSUE2160_ROUTE: ${{ inputs.route }}
      ISSUE2160_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      ISSUE2160_RECEIPT_STEM: ${{ inputs.receipt_stem }}
      ISSUE2160_GRANT_LOOKUP_KEY: ${{ inputs.grant_lookup_key }}
      GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Verify immutable reviewed candidate before checkout
        shell: bash
        env:
          ISSUE2160_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          for value_name in ISSUE2160_CANDIDATE_SHA GITHUB_SHA GITHUB_WORKFLOW_SHA; do
            value="${!value_name}"
            [[ "$value" =~ ^[0-9a-f]{40}$ ]] || { echo "expected full reviewed SHA for ${value_name}" >&2; exit 1; }
          done
          [[ "$ISSUE2160_CANDIDATE_SHA" == "$GITHUB_SHA" ]]
          [[ "$ISSUE2160_CANDIDATE_SHA" == "$GITHUB_WORKFLOW_SHA" ]]

      - name: Checkout immutable candidate
        id: checkout_candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Download hosted preflight evidence
        uses: actions/download-artifact@v4
        with:
          name: issue2160-hosted-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/issue2160-hosted

      - name: Reverify run binding and read coordinator grant
        id: authorize_native
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          /usr/bin/python3 -B -m scripts.linux_x11_hosted authorize-native
          --preflight TestResults/issue2160-hosted/preflight.json
          --output TestResults/issue2160-hosted/grant.json

      - name: Confirm grant freeze before native smoke
        id: confirm_grant
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          /usr/bin/python3 -B -m scripts.linux_x11_hosted confirm-grant
          --grant TestResults/issue2160-hosted/grant.json

      - name: Run bounded native X11 smoke
        id: native_smoke
        run: >-
          /usr/bin/python3 -B -m scripts.tests.linux_x11_native_smoke
          --allow-native-smoke
          --timeout 20
          --receipt-dir linux-x11-smoke-${{ inputs.receipt_stem }}

      - name: Validate bounded native X11 receipt
        id: validate_receipt
        run: >-
          /usr/bin/python3 -B -m scripts.linux_x11_hosted validate-receipt
          --preflight TestResults/issue2160-hosted/preflight.json
          --receipt linux-x11-smoke-${{ inputs.receipt_stem }}/receipt.json

      - name: Prepare hosted native artifact bundle
        id: prepare_native_artifacts
        if: ${{ always() && steps.checkout_candidate.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          bundle='TestResults/issue2160-hosted/upload'
          mkdir -p "$bundle"
          for file in TestResults/issue2160-hosted/preflight.json TestResults/issue2160-hosted/grant.json; do
            if [[ -f "$file" ]]; then
              cp "$file" "$bundle/$(basename "$file")"
            fi
          done
          receipt="linux-x11-smoke-${{ inputs.receipt_stem }}/receipt.json"
          if [[ -f "$receipt" ]]; then
            /usr/bin/python3 -B -m scripts.linux_x11_hosted summarize-receipt \
              --receipt "$receipt" \
              --output "$bundle/receipt-summary.json"
          fi

      - name: Upload hosted native receipt
        if: ${{ always() && steps.checkout_candidate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: issue2160-hosted-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults/issue2160-hosted/upload/preflight.json
            TestResults/issue2160-hosted/upload/grant.json
            TestResults/issue2160-hosted/upload/receipt-summary.json
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7
